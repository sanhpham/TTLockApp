name: Build and Deploy to SmarterASP.NET

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build_and_deploy:
    runs-on: windows-latest

    steps:
      # 1. Checkout source code
      - name: Checkout source
        uses: actions/checkout@v4

      # 2. Setup .NET 10 SDK
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # 3. Restore NuGet packages
      - name: Restore dependencies
        run: dotnet restore

      # 4. Inject production appsettings từ GitHub Secrets
      - name: Write production appsettings.json
        shell: pwsh
        run: |
          $json = @{
            Logging = @{
              LogLevel = @{
                Default = "Warning"
                "Microsoft.AspNetCore" = "Warning"
              }
            }
            AllowedHosts = "*"
            ConnectionStrings = @{
              DefaultConnection = "${{ secrets.DB_CONNECTION_STRING }}"
            }
            TTLock = @{
              ClientId     = "${{ secrets.TTLOCK_CLIENT_ID }}"
              ClientSecret = "${{ secrets.TTLOCK_CLIENT_SECRET }}"
            }
          } | ConvertTo-Json -Depth 5
          Set-Content -Path appsettings.json -Value $json -Encoding UTF8
          Write-Host "appsettings.json written successfully."

      # 5. Build & Publish (Framework-dependent, Portable - server cần cài .NET runtime)
      - name: Publish app
        run: dotnet publish -c Release --no-self-contained -o ./publish

      # 6. Deploy lên SmarterASP.NET qua FTP
      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./publish/
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
          dangerous-clean-slate: false
